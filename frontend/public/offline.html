<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Sin conexión · Mantención</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
      main { max-width: 420px; padding: 28px; border: 1px solid #dbe3ef; border-radius: 18px; background: white; text-align: center; box-shadow: 0 8px 30px #0f172a12; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0 0 20px; color: #64748b; line-height: 1.5; }
      button { border: 0; border-radius: 9px; padding: 11px 18px; color: white; background: #2563eb; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>La aplicación está instalada, pero no hay conexión con el servidor. Tus borradores locales se conservarán.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
