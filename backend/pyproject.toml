[project]
name = "maintenance-backend"
version = "0.1.0"
description = "Backend API for maintenance platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]==1.7.4",
    # passlib 1.7.4 is incompatible with bcrypt>=5 (API changes); pin <5.
    "bcrypt>=4.0.1,<5",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "httpx>=0.28.0",
    "pywebpush>=2.0.0",
    "google-api-python-client>=2.154.0",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

# Only package the "app" directory (there is also an "alembic" dir at
# the same level that must not be treated as a Python package).
[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
