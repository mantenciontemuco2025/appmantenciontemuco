services:
  postgres:
    image: postgres:16-alpine
    container_name: maintenance_postgres
    environment:
      POSTGRES_USER: maintenance_user
      POSTGRES_PASSWORD: maintenance_pass
      POSTGRES_DB: maintenance_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance_user -d maintenance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
